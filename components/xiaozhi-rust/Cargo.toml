[package]
name = "xiaozhi-rust"
version = "0.1.0"
authors = ["XiaoZhi Contributors"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[lib]
crate-type = ["staticlib"]

[dependencies]
esp-idf-svc = { version = "0.51", default-features = false, features = ["alloc", "std"] }
log = "0.4"

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true

[profile.dev]
debug = true
opt-level = "s"
